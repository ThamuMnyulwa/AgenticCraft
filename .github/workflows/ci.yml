name: CI

on:
  push:
    branches: [main] # PR branches are covered by pull_request, so they run once
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets gitleaks-action comment on PRs that leak a secret
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Personal-account repos need no GITLEAKS_LICENSE; organisations do.
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pre-commit:
    name: pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        env:
          SKIP: gitleaks # covered by the secrets job
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
